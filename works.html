<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class="is-sub">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Archivo:wght@300;400;500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<body data-page="works">

<a class="site-logo" href="index.html"><img src="assets/img/logo.webp" alt="共鳴線 LyraLine"></a>

<header class="corner">

    <div class="lang-switch" role="group" data-i18n-attr="aria-label:ui.lang">
      <button type="button" data-lang="zh" lang="zh-CN">中</button>
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="ja" lang="ja">日</button>
    </div>
    <button type="button" class="icon-btn theme-btn" id="themeBtn" data-i18n-attr="aria-label:ui.theme;title:ui.theme"><span class="theme-dot"></span></button>
    <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-controls="menu" aria-expanded="false" data-i18n-attr="aria-label:ui.menu;title:ui.menu"><span></span><span></span><span></span></button>
  </div>
</header>

<nav class="menu" id="menu" aria-hidden="true">
  <div class="menu-inner">
    <div class="menu-head"><span class="kicker">Index</span><span data-i18n="home.dirTitle"></span></div>
    <ol class="dir-list" id="menuList"></ol>
    <div class="menu-foot" data-i18n="site.tagline"></div>
  </div>
</nav>

<div class="sub">
  <!-- 左：板块标题（桌面端固定在左侧，对应首页唱片的位置） -->
  <aside class="sub-side">
    <a class="sub-back" href="index.html#works"><i class="chev" aria-hidden="true"></i><span data-i18n="ui.backHome"></span></a>
    <div class="page-head">
      <span class="page-letter">B</span>
      <h1 class="page-title">WORKS</h1>
      <span class="page-local" data-i18n="nav.works"></span>
    </div>
    <p class="lead sub-lead" data-i18n="works.lead"></p>
    <div class="sub-filter" id="subFilter" role="group">
      <button type="button" data-filter="all"><span>ALL</span><span data-i18n="ui.all"></span></button>
      <button type="button" data-filter="mv"><span>MUSIC VIDEO</span><span data-i18n="works.sub1"></span></button>
      <button type="button" data-filter="album"><span>ALBUM</span><span data-i18n="works.sub2"></span></button>
      <button type="button" data-filter="teaser"><span>TEASER</span><span data-i18n="works.sub3"></span></button>
    </div>
    <a class="btn-more" href="music.html"><span data-i18n="music.listen"></span><i class="chev" aria-hidden="true"></i></a>

  <!-- 右：列表 / 详情（js/render.js 按 js/data.js 渲染） -->
  <main class="sub-main" id="subMain"></main>

<footer class="sub-foot">
  <a href="index.html" class="sub-foot-logo"><img src="assets/img/logo.webp" alt="共鳴線 LyraLine"></a>

</footer>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/sub.js"></script>
